name: APK Android

# Compila el APK firmado y lo publica en GitHub Releases.
# Se dispara con un tag "apk-v1.2.3" (git tag apk-v1.2.3 && git push origin apk-v1.2.3)
# o a mano desde la pestaña Actions indicando la versión.
on:
  push:
    tags: ["apk-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej: 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Falta la clave de firma
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Faltan los secrets de firma (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). No se compila el APK; ver README."

      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'

      - name: Versión
        if: env.HAS_KEYSTORE == 'true'
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#apk-v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=apk-v$V" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: env.HAS_KEYSTORE == 'true'
        run: pnpm install --frozen-lockfile

      # La interfaz se carga desde GitHub Pages; igual Capacitor necesita una copia local (webDir)
      - if: env.HAS_KEYSTORE == 'true'
        run: pnpm build
      - if: env.HAS_KEYSTORE == 'true'
        run: pnpm exec cap sync android

      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Clave de firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK firmado
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.v.outputs.version }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar release
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          APK="TrainingHelper-$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="Descargá **$APK** desde el celular e instalalo (permití \"instalar apps desconocidas\" si te lo pide)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Training Helper $V (Android)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
